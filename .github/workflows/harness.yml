# Harness del agente — puerta de CI (Fase 3).
# Push/PR: solo evals deterministas (locales, gratis, sin red).
# Semanal: además el router con LLM real + probe de structured outputs (cuota controlada).
name: harness

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # El cliente Prisma generado (src/generated) está gitignorado: sin este
      # paso, test:types falla con TS2307 y los evals que importan Prisma
      # revientan en ModuleNotFound. Generate es offline (293ms) y sin DB.
      - run: npx prisma generate
      - run: npm run test:harness

  llm-weekly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:router
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm run acs:probe-structured
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
